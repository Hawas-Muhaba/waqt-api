[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waqt-core"
version = "0.3.0"
description = "Independently distributable computation layer for Waqt (Maghrib-to-Maghrib civil time and Hijri calendar): astronomy, Hijri calendars, scheduling, institutional calendars."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Waqt project" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "ephem>=4.1",
    "timezonefinder>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build"]

[project.urls]
Homepage = "https://github.com/waqt-project/waqt-api"
Documentation = "https://github.com/waqt-project/waqt-api/blob/main/docs/LOCAL.md"

[tool.setuptools.packages.find]
include = ["waqt_core*"]

[tool.setuptools.package-data]
waqt_core = ["py.typed"]
