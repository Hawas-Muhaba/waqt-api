name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node (independent consumer)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Independent JS consumer
        run: cd consumers/js && npm test

      - name: Independent implementation unit tests
        run: cd conformance/independent && node --test test/*.test.mjs

      - name: Contract integrity verification
        run: |
          python conformance/tools/contract.py verify
          python conformance/tools/migrate_contract_2_0.py --check

      - name: Full Conformance Suite
        run: WAQT_RUN_CONFORMANCE=1 pytest tests/test_conformance_suite.py -v --tb=short

      - name: Python SDK
        run: |
          pip install -e ./sdks/python
          pytest sdks/python/tests/ -v --tb=short

      - name: JavaScript SDK
        run: cd sdks/js/waqt-client && npm test

      - name: Run tests (waqt.api)
        run: pytest tests/ -v --tb=short --deselect tests/test_packaging_smoke.py --deselect tests/test_conformance_suite.py

      # Sprint 11: waqt-core is now its own distribution with its own
      # test suite (conformance against the shared vectors, driven
      # standalone with no FastAPI/waqt on the path; the shim-identity
      # check; packaging). Run separately from tests/ -- neither
      # directory has __init__.py, so pytest's basename-based module
      # import collides on same-named files (e.g.
      # test_waqt_vectors_conformance.py) if invoked in one command.
      - name: Run tests (waqt-core)
        run: pytest core/tests/ -v --tb=short --deselect core/tests/test_packaging_smoke.py

      # Sprint 10: waqt_local, the embeddable no-server library.
      - name: Run tests (waqt_local)
        run: pytest local/tests/ -v --tb=short

      # Sprint 10/11: independent astronomical references (Level A/B)
      # used to evaluate the production solar engine.
      # Sprint 13: the JPL/Skyfield independent reference needs these; without them its tests
      # importorskip and would silently not run.
      - name: Install astronomy reference dependencies
        run: pip install pymeeus skyfield jplephem de421 packaging
      - name: Run tests (independent-astronomy)
        run: cd independent-astronomy && pytest tests/ -v --tb=short

      # Sprint 13: version-axis consistency + real-server live checks.
      - name: Live stack check (real uvicorn, CORS, vectors)
        run: python verification/live_stack_check.py
      # Sprint 14: an API change must be additive w.r.t. the committed conformance vectors.
      # Run BEFORE regenerating vectors; fails if any recorded value changed or disappeared.
      - name: Vector additivity (no regression in recorded responses)
        run: python verification/vector_additivity_check.py
      - name: Run tests (apps)
        run: |
          pip install -e ./core -e . -e ./local -e apps/cli -e apps/api-consumer
          for d in apps/cli apps/api-consumer apps/web; do (cd $d && pytest tests -q); done

      # Packaging / clean-install smoke tests: slow (spawn a venv +
      # build + pip install each), run last and separately so a
      # failure here doesn't obscure a real regression above.
      - name: Clean-install packaging smoke tests
        run: |
          pytest core/tests/test_packaging_smoke.py -v --tb=short
          pytest tests/test_packaging_smoke.py -v --tb=short

  # Sprint 14: real headless Chrome against the real API, AlAdhan replaced by a local fake
  # (the live service is a third party; CI must not depend on it). CORS is genuinely enforced.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt uvicorn
      - run: cd verification/browser && npm install --no-audit --no-fund
      - name: Sprint 14 browser verification
        run: bash verification/browser/run_sprint14.sh
